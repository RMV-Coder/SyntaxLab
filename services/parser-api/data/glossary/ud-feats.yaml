# Curated definitions: UD v2 morphological features.
# Source: https://universaldependencies.org/u/feat/ (paraphrased).
# `gloss` values follow the Leipzig Glossing Rules standard abbreviations
# (https://www.eva.mpg.de/lingua/resources/glossing-rules.php). Where the LGR list has no
# abbreviation, `gloss_standard: false` marks a SyntaxLab choice; values with no customary
# gloss (e.g. Degree=Pos) have none and are shown only as Feature=Value.
id: ud-feats
kind: features
source: https://universaldependencies.org/u/feat/
entries:
  Number:
    name: number
    definition: Grammatical number of a nominal, or agreement with it on a verb.
    url: https://universaldependencies.org/u/feat/Number.html
    values:
      Sing: {name: singular, gloss: SG}
      Plur: {name: plural, gloss: PL}
      Ptan: {name: 'plurale tantum (plural-only noun, e.g. "scissors")'}
  Person:
    name: person
    definition: >-
      Distinguishes the speaker (1), the addressee (2) and others (3), on pronouns and on verbs
      that agree with them.
    url: https://universaldependencies.org/u/feat/Person.html
    values:
      "1": {name: first person, gloss: "1"}
      "2": {name: second person, gloss: "2"}
      "3": {name: third person, gloss: "3"}
  Case:
    name: case
    definition: >-
      Marks the role of a nominal in the clause. English shows case only on pronouns
      ("I/me/my") and with possessive "'s".
    url: https://universaldependencies.org/u/feat/Case.html
    values:
      Nom: {name: nominative, gloss: NOM}
      Acc: {name: accusative, gloss: ACC}
      Gen: {name: genitive, gloss: GEN}
      Dat: {name: dative, gloss: DAT}
      Loc: {name: locative, gloss: LOC}
  Gender:
    name: gender
    definition: Grammatical gender; in English visible only on third-person singular pronouns.
    url: https://universaldependencies.org/u/feat/Gender.html
    values:
      Masc: {name: masculine, gloss: M}
      Fem: {name: feminine, gloss: F}
      Neut: {name: neuter, gloss: N}
  Tense:
    name: tense
    definition: Locates the event in time relative to a reference point, usually the moment of speech.
    url: https://universaldependencies.org/u/feat/Tense.html
    values:
      Past: {name: past, gloss: PST}
      Pres: {name: present, gloss: PRS}
      Fut: {name: future, gloss: FUT}
  Aspect:
    name: aspect
    definition: The internal temporal structure of an event (completed, ongoing, ...).
    url: https://universaldependencies.org/u/feat/Aspect.html
    values:
      Perf: {name: perfect, gloss: PRF}
      Imp: {name: imperfective, gloss: IPFV}
      Prog: {name: progressive, gloss: PROG}
  Mood:
    name: mood
    definition: The speaker's stance toward the proposition (statement, command, condition, ...).
    url: https://universaldependencies.org/u/feat/Mood.html
    values:
      Ind: {name: indicative, gloss: IND}
      Imp: {name: imperative, gloss: IMP}
      Sub: {name: subjunctive, gloss: SBJV}
      Cnd: {name: conditional, gloss: COND}
      Pot: {name: potential, gloss: POT, gloss_standard: false}
  VerbForm:
    name: form of verb
    definition: Whether a verb form is finite (inflected for tense/mood) or a non-finite form.
    url: https://universaldependencies.org/u/feat/VerbForm.html
    values:
      Fin: {name: finite verb, gloss: FIN, gloss_standard: false}
      Inf: {name: infinitive, gloss: INF}
      Part: {name: participle, gloss: PTCP}
      Ger: {name: gerund, gloss: GER, gloss_standard: false}
  Voice:
    name: voice
    definition: >-
      The relation between the verb and its arguments. Note that languages differ: Tagalog
      "voice" marks which argument is in focus and is not the same as the English passive.
    url: https://universaldependencies.org/u/feat/Voice.html
    values:
      Act: {name: active, gloss: ACT, gloss_standard: false}
      Pass: {name: passive, gloss: PASS}
      Cau: {name: causative, gloss: CAUS}
      Bfoc: {name: beneficiary focus, gloss: BFOC, gloss_standard: false}
      Lfoc: {name: location focus, gloss: LFOC, gloss_standard: false}
  Definite:
    name: definiteness
    definition: Whether the noun phrase refers to something identifiable to the hearer.
    url: https://universaldependencies.org/u/feat/Definite.html
    values:
      Def: {name: definite, gloss: DEF}
      Ind: {name: indefinite, gloss: INDF}
  PronType:
    name: pronominal type
    definition: The subclass of a pronoun or determiner.
    url: https://universaldependencies.org/u/feat/PronType.html
    values:
      Prs: {name: personal or possessive}
      Art: {name: article, gloss: ART}
      Dem: {name: demonstrative, gloss: DEM}
      Int: {name: interrogative, gloss: INT, gloss_standard: false}
      Rel: {name: relative, gloss: REL}
      Ind: {name: indefinite, gloss: INDF}
      Tot: {name: 'total (collective, e.g. "every")', gloss: TOT, gloss_standard: false}
      Neg: {name: 'negative (e.g. "no", "nobody")', gloss: NEG}
      Rcp: {name: reciprocal, gloss: RECP}
  Poss:
    name: possessive
    definition: Marks possessive pronouns and determiners ("my", "their").
    url: https://universaldependencies.org/u/feat/Poss.html
    values:
      "Yes": {name: possessive, gloss: POSS}
  Reflex:
    name: reflexive
    definition: Marks reflexive pronouns ("herself").
    url: https://universaldependencies.org/u/feat/Reflex.html
    values:
      "Yes": {name: reflexive, gloss: REFL}
  Polarity:
    name: polarity
    definition: Whether a word expresses negation ("not", "no") or affirmation.
    url: https://universaldependencies.org/u/feat/Polarity.html
    values:
      Neg: {name: negative, gloss: NEG}
      Pos: {name: positive}
  Degree:
    name: degree of comparison
    definition: The degree of an adjective or adverb (big, bigger, biggest).
    url: https://universaldependencies.org/u/feat/Degree.html
    values:
      Pos: {name: 'positive (base form)'}
      Cmp: {name: comparative, gloss: CMPR, gloss_standard: false}
      Sup: {name: superlative, gloss: SUPL, gloss_standard: false}
  NumType:
    name: numeral type
    definition: The subclass of a numeral (cardinal, ordinal, ...).
    url: https://universaldependencies.org/u/feat/NumType.html
    values:
      Card: {name: 'cardinal (one, two)'}
      Ord: {name: 'ordinal (first, second)'}
      Mult: {name: 'multiplicative (twice)'}
      Frac: {name: 'fraction (half)'}
  NumForm:
    name: numeral form
    definition: How a numeral is written (digits, words, Roman numerals).
    url: https://universaldependencies.org/u/feat/NumForm.html
    values:
      Digit: {name: digits}
      Word: {name: words}
      Roman: {name: Roman numerals}
      Combi: {name: combination of digits and words}
  Abbr:
    name: abbreviation
    definition: The word is an abbreviation.
    url: https://universaldependencies.org/u/feat/Abbr.html
    values:
      "Yes": {name: abbreviation}
  Foreign:
    name: foreign word
    definition: The word is from another language and not integrated into this one.
    url: https://universaldependencies.org/u/feat/Foreign.html
    values:
      "Yes": {name: foreign}
  Typo:
    name: typo
    definition: The word is misspelled in the source text.
    url: https://universaldependencies.org/u/feat/Typo.html
    values:
      "Yes": {name: misspelled}
  ExtPos:
    name: external part of speech
    definition: >-
      The part of speech that a fixed multiword expression has as a whole (e.g. "because of"
      behaves like an adposition).
    url: https://universaldependencies.org/u/feat/ExtPos.html
