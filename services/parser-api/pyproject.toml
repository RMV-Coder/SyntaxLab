[project]
name = "syntaxlab-api"
version = "0.1.0"
description = "SyntaxLab parser API: pluggable syntactic analysis engines behind a versioned REST API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Engine back-ends are optional: the core API, schemas, and tests run without any NLP library.
stanza = [
    "stanza==1.15.0",
    "torch>=2.9",
]

[project.scripts]
syntaxlab-api = "syntaxlab_api.cli:main"

# Engine plug-in point. Third-party packages can register engines under the same group;
# a language then selects an engine by name in config/languages.yaml, with no code change here.
[project.entry-points."syntaxlab.engines"]
stanza = "syntaxlab_api.engines.stanza_engine:StanzaEngine"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntaxlab_api"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not models'"
markers = [
    "models: needs real NLP models downloaded (run with `-m models`; excluded by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# γ is the conventional augmented start symbol of Earley parsing (Jurafsky & Martin).
allowed-confusables = ["γ"]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = [
    "S101",  # assert is fine in tests and internal invariants
    "N818",  # domain exception names (UnsupportedLanguage, Overloaded) read better without "Error"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["syntaxlab_api"]

[[tool.mypy.overrides]]
module = ["stanza", "stanza.*", "torch"]
ignore_missing_imports = true
