# SyntaxLab language configuration.
#
# This file is the only place languages are declared. To add a language:
#   1. Make sure an installed engine supports it (`syntaxlab-api check` lists engines).
#      The built-in `stanza` engine covers every language Stanza ships models for; other
#      back-ends plug in through the `syntaxlab.engines` entry-point group.
#   2. Add an entry below: engine options, the annotation scheme of each structural layer,
#      samples, and notes describing known limitations.
#   3. Run `syntaxlab-api download-models --language <code>` and
#      `syntaxlab-api check --language <code> --load`.
# No API or frontend code changes are needed: clients discover languages, capabilities and
# schemes from GET /api/v1/languages.
#
# Only list capabilities that have been evaluated; see docs/research/nlp-model-evaluation.md.

schemes:
  ud-2:
    name: Universal Dependencies v2
    url: https://universaldependencies.org/u/dep/
  ud-upos:
    name: Universal POS tags (UD v2)
    url: https://universaldependencies.org/u/pos/
  ud-feats:
    name: Universal features (UD v2)
    url: https://universaldependencies.org/u/feat/
  ptb-revised:
    name: Penn Treebank (revised; NML nodes, split hyphens)
    url: https://stanfordnlp.github.io/stanza/constituency.html

languages:
  - code: en
    name: English
    native_name: English
    aliases: [eng]
    engine: stanza
    engine_options:
      lang: en
      package: default            # charlm models; "default_accurate" adds ~1.3 GB of transformers
      processors: [tokenize, mwt, pos, lemma, depparse, constituency]
    schemes:
      pos: ud-upos
      morphology: ud-feats
      dependency: ud-2
      constituency: ptb-revised
    samples:
      - text: The child is eating rice.
      - text: I saw the man with a telescope.
        note: >-
          Ambiguous: the telescope can be the instrument of seeing or belong to the man.
          The parser returns only one of the two readings.
      - text: Did the students not read the book that the professor recommended?
        note: Yes/no question with negation and a relative clause.
      - text: She arrived late because the train was delayed, but the meeting had not started.
        note: Coordination, a subordinate clause, and a passive.
    notes:
      - >-
        Dependency analyses follow Universal Dependencies v2 (Stanza model trained on UD
        English corpora). Measured on UD English-EWT test: LAS 89.7 (in-domain).
      - >-
        Constituency trees follow Penn Treebank conventions (e.g. NN, VBD, SBAR), which differ
        from many introductory textbook trees (e.g. N, V, X-bar levels). Labels are shown as the
        parser produced them.
      - The parser returns a single analysis even for ambiguous sentences.
      - >-
        The dependency and constituency analyses come from two independent models. On
        ambiguous sentences they can choose different readings (e.g. in "I don't like the man
        with a telescope" the dependency model attaches "telescope" to the verb, while the
        constituency model attaches the PP to "the man"). Neither view is derived from the other.

  - code: tl
    name: Filipino (Tagalog)
    native_name: Filipino
    aliases: [fil, tgl]
    engine: spacy
    engine_options:
      # Choice and settings measured in docs/research/nlp-model-evaluation.md, section 3.8.
      model: tl_calamancy_md
      version: 0.2.0
      wheel_url: https://huggingface.co/ljvmiranda921/tl_calamancy_md/resolve/main/tl_calamancy_md-any-py3-none-any.whl
      wheel_sha256: ed8e18e09b7ac2664d97b05d0b66e638e4be20f2f2a96efea8a58693278d6b29
      components: [trainable_lemmatizer, morphologizer, parser]
      shared_components: [tok2vec]
      keep_hyphenated_words: true   # UD Tagalog keeps nag-aral whole
      split_sentences: true         # the parser does not find boundaries by itself
      abbreviations: [            # a period after these ends no sentence
        G, Gng, Bb, Mr, Mrs, Ms, Dr, Dra, Atty, Engr, Prof, Hon, Fr, Sr, Jr,
        Pres, Sen, Sec, Rep, Gov, Gen, Col, Maj, Capt, Lt, Sgt, Supt, Insp,
        St, Inc, Corp, Co, Ltd, "No", Nos, vs, Int,
        Ene, Peb, Abr, Hun, Hul, Ago, Okt, Nob, Dis, Jan, Feb, Apr, Jun, Jul, Aug, Sep, Oct, Nov, Dec,
        A, B, C, D, E, F, H, I, J, K, L, M, N, O, P, Q, R, S, T, U, V, W, X, Y, Z,
      ]
    schemes:
      pos: ud-upos
      morphology: ud-feats
      dependency: ud-2
    # Sample sentences and translations: UD_Tagalog-TRG (CC BY-SA 4.0), from Schachter & Otanes
    # (1972). Attribution: tests/fixtures/ud/README.md.
    samples:
      - text: Binili ng mangingisda ang bangka.
        note: >-
          "The fisherman bought the boat." Patient voice: the boat takes ang, and the fisherman is
          the agent (obj:agent).
      - text: Bumili ng bangka ang mangingisda.
        note: >-
          "The fisherman bought a boat." Actor voice: now the fisherman takes ang. Compare with the
          sentence above.
      - text: Binabasa ng titser ang diyaryo.
        note: '"The teacher is reading the newspaper." Patient voice, imperfective aspect.'
      - text: Nagluluto na ng pagkain ang nanay.
        note: '"Mother is cooking some food now." Actor voice, with the particle na.'
      - text: Mayroong libro ang bata.
        note: '"The child has a book." Mayroon expresses possession and existence.'
      - text: Nasa kusina ang mesa.
        note: '"The table is in the kitchen." A predicate without a verb.'
    notes:
      - >-
        Analyses come from calamanCy v0.2.0 (tl_calamancy_md), trained on UD_Tagalog-NewsCrawl,
        which is Manila news prose. They can be wrong. Validity is claimed only for standard written
        Filipino/Tagalog: not for Taglish or code-switching, social-media text, older literary
        Tagalog, or regional varieties.
      - >-
        Measured on raw text, punctuation included. Grammar-book sentences (UD_Tagalog-TRG, held
        out from training): UAS 93.6, LAS 76.8. News sentences (UD_Tagalog-NewsCrawl test): UAS 72.6,
        LAS 68.6. On news the published figure is LAS 77.1, excluding punctuation and with a
        different word alignment. On grammar-book sentences LAS is held down by a difference
        between treebanks: TRG labels ang as case, while this model learned det.
      - >-
        There are no phrase-structure trees for Filipino: no parser or treebank for them exists.
        SyntaxLab does not derive trees from dependencies.
      - >-
        The linker -ng is not split from its word (magandang stays one word), although the
        treebank analyzes it as maganda + -ng.
      - >-
        Known errors, shown as they are, not corrected: capitalized first words can get an unreliable
        lemma and aspect (Kumakain as Aspect=Perf), and adjectival predicates can be tagged as VERB
        (Maganda ang babae).
      - >-
        Sentence boundaries are found by punctuation, because this parser does not find them.
        Common titles and initials are recognized, but another abbreviation with a period can be
        mistaken for the end of a sentence.
      - The parser returns a single analysis even for ambiguous sentences.
