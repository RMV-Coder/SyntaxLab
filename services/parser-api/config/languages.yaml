# SyntaxLab language configuration.
#
# This file is the only place languages are declared. To add a language:
#   1. Make sure an installed engine supports it (`syntaxlab-api check` lists engines).
#      The built-in `stanza` engine covers every language Stanza ships models for; other
#      back-ends plug in through the `syntaxlab.engines` entry-point group.
#   2. Add an entry below: engine options, the annotation scheme of each structural layer,
#      samples, and notes describing known limitations.
#   3. Run `syntaxlab-api download-models --language <code>` and
#      `syntaxlab-api check --language <code> --load`.
# No API or frontend code changes are needed: clients discover languages, capabilities and
# schemes from GET /api/v1/languages.
#
# Only list capabilities that have been evaluated; see docs/research/nlp-model-evaluation.md.

schemes:
  ud-2:
    name: Universal Dependencies v2
    url: https://universaldependencies.org/u/dep/
  ud-upos:
    name: Universal POS tags (UD v2)
    url: https://universaldependencies.org/u/pos/
  ud-feats:
    name: Universal features (UD v2)
    url: https://universaldependencies.org/u/feat/
  ptb-revised:
    name: Penn Treebank (revised; NML nodes, split hyphens)
    url: https://stanfordnlp.github.io/stanza/constituency.html

languages:
  - code: en
    name: English
    native_name: English
    aliases: [eng]
    engine: stanza
    engine_options:
      lang: en
      package: default            # charlm models; "default_accurate" adds ~1.3 GB of transformers
      processors: [tokenize, mwt, pos, lemma, depparse, constituency]
    schemes:
      pos: ud-upos
      morphology: ud-feats
      dependency: ud-2
      constituency: ptb-revised
    samples:
      - text: The child is eating rice.
      - text: I saw the man with a telescope.
        note: >-
          Ambiguous: the telescope can be the instrument of seeing or belong to the man.
          The parser returns only one of the two readings.
      - text: Did the students not read the book that the professor recommended?
        note: Yes/no question with negation and a relative clause.
      - text: She arrived late because the train was delayed, but the meeting had not started.
        note: Coordination, a subordinate clause, and a passive.
    notes:
      - >-
        Dependency analyses follow Universal Dependencies v2 (Stanza model trained on UD
        English corpora). Measured on UD English-EWT test: LAS 89.7 (in-domain).
      - >-
        Constituency trees follow Penn Treebank conventions (e.g. NN, VBD, SBAR), which differ
        from many introductory textbook trees (e.g. N, V, X-bar levels). Labels are shown as the
        parser produced them.
      - The parser returns a single analysis even for ambiguous sentences.
      - >-
        The dependency and constituency analyses come from two independent models. On
        ambiguous sentences they can choose different readings (e.g. in "I don't like the man
        with a telescope" the dependency model attaches "telescope" to the verb, while the
        constituency model attaches the PP to "the man"). Neither view is derived from the other.
