name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Parser API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/parser-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/parser-api/uv.lock
      - run: uv sync --extra stanza --group dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Unit + API tests run without NLP models (the test engine and hand-built Stanza docs).
      - run: uv run pytest --cov=syntaxlab_api --cov-report=term-missing

  contract:
    name: API contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/parser-api/uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd services/parser-api && uv sync --locked
      - run: pnpm api:types
      - name: Fail if generated OpenAPI/TypeScript types are stale
        run: git diff --exit-code -- apps/web/lib/api/

  web:
    name: Web (lint, types, unit tests, build, E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SYNTAXLAB_API_URL: http://api.syntaxlab.test
      - run: pnpm exec playwright install --with-deps chromium
      # E2E intercepts API calls with responses recorded from the real parser (e2e/fixtures).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  models:
    name: Linguistic regression (real models)
    # Downloads ~430 MB of models; runs on main and on demand, not on every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/parser-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/parser-api/uv.lock
      - run: uv sync --extra stanza --group dev --locked
      - uses: actions/cache@v4
        with:
          path: services/parser-api/.models
          key: models-${{ hashFiles('services/parser-api/config/languages.yaml', 'services/parser-api/uv.lock') }}
      - run: uv run syntaxlab-api download-models
      - run: uv run pytest -m models -s

  image:
    name: API image builds and serves
    # The production image bakes in the models: build it, start it, and parse one sentence.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/parser-api
          tags: syntaxlab-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container (2 CPUs, 4 GB, as on the host)
        run: docker run -d --name api -p 7860:7860 --cpus 2 --memory 4g syntaxlab-api:ci
      - name: Wait for the models to load
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:7860/ready; then echo; exit 0; fi
            sleep 5
          done
          docker logs api
          exit 1
      - name: Parse a sentence
        run: |
          curl -fsS -X POST localhost:7860/api/v1/parse             -H 'Content-Type: application/json'             -d '{"language": "en", "text": "The child is eating rice."}'             | python3 -c 'import json, sys; s = json.load(sys.stdin)["sentences"][0]; print([t["form"] for t in s["tokens"]]); assert s["dependency"] and s["constituency"]'
      - name: Image size and memory
        if: always()
        run: |
          docker image ls syntaxlab-api:ci
          docker stats --no-stream api || true
          docker logs api | tail -20
